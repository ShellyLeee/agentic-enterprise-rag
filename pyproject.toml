[project]
name = "agentic-enterprise-rag"
version = "0.1.0"
description = "Agent-driven Enterprise RAG system with LangChain tools, FAISS retrieval, reranking, citations, traces, and evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "langchain>=0.3",
  "langchain-community>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "faiss-cpu>=1.8",
  "sentence-transformers>=3.0",
  "rank-bm25>=0.2",
  "tiktoken>=0.8",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

